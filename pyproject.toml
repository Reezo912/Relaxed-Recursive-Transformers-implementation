[project]
name = "relaxed-recursive-transformers"
version = "0.2.0"
description = "PyTorch + Triton implementation of Relaxed Recursive Transformers with ASVD/DoRA Hugging Face conversion, 2-stage Strong-to-Weak distillation, and Continuous Depth-Wise Batching"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
keywords = [
    "transformers",
    "recursive-transformers",
    "lora",
    "triton",
    "knowledge-distillation",
    "model-compression",
    "pytorch",
]
dependencies = [
    "datasets>=3.0",
    "huggingface-hub>=0.25",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "torch>=2.4",
    "transformers>=4.51",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rrt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
